name: Build & Release NEXCORE APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify or Build NEXCORE Debug APK
        run: |
          if [ -f "NEXCORE-debug.apk" ]; then
            echo "Using pre-built signed NEXCORE-debug.apk from repository root."
            ls -lh NEXCORE-debug.apk
          elif [ -f ".build-outputs/app-debug.apk" ]; then
            echo "Copying pre-built APK from .build-outputs/app-debug.apk..."
            cp .build-outputs/app-debug.apk NEXCORE-debug.apk
            ls -lh NEXCORE-debug.apk
          else
            echo "No pre-built APK found; building from source..."
            if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            fi
            if [ ! -f .env ] && [ -f .env.example ]; then
              cp .env.example .env
            fi
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true
            gradle :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk NEXCORE-debug.apk
          fi

      - name: Upload NEXCORE APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXCORE-debug-apk
          path: NEXCORE-debug.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "NEXCORE Android APK (v1.0.${{ github.run_number }})"
          body: |
            ### NEXCORE — C&D Waste Management Digital Marketplace (Android APK)
            Tap **`NEXCORE-debug.apk`** below under **Assets** to download and install the app on your Android phone.
          files: NEXCORE-debug.apk
          prerelease: false
          make_latest: true
